# SubLoader 完整配置示例（全部 21 个配置项）
#
# 首次使用：
#   1. 复制为 config.toml：cp -n config.example.toml config.toml
#   2. 填写 api_urls，并确认 token 的获取方式。
#   3. 执行 ./run.sh --once，生成只包含节点的订阅。
#   4. Clash Verge 配合 clash/groups.yaml 和 clash/routing.yaml 使用，见 README。
#
# 所有支持的配置项都已列出，直接修改等号右侧即可，不需要取消注释。
# 不配置的字段可以填 ""，程序会使用默认值；false 和 0 是有效配置。
# 列表使用 [] 表示空列表；api_urls 是必填项，至少填写一个实际 API 地址。
# token 和域名发现接口未填写时，分别自动读取、跳过。
# 环境变量优先于本文件；SUBLOADER_TOKEN 若存在但为空，会报错。
# 真实地址和凭据只填入本机 config.toml，不要提交到 GitHub。


# ── 1. 连接服务与身份认证 ────────────────────────────────────
[api]

# 【必填】服务 API 根地址，例如 ["https://api.example.invalid"]。
# 多个地址按顺序尝试，不要追加接口路径或个人订阅参数。
api_urls = []

# 留空或填写 auto：优先读取下方 token_file，未配置文件时读取 macOS WWSS App。
# 也可以直接填写 token，或用 SUBLOADER_TOKEN 环境变量覆盖。
# 节点下载程序不接收账号密码，也不会自动登录或续期 token。
# 可运行 ./run.sh login 生成 token 文件，再配置下方 token_file 读取。
token = ""

# 可选单行 token 文件；相对路径以项目根目录为准，支持 ~/ 和绝对路径。
# 使用账号密码登录时填写 "data/wwss-token.txt"，与登录配置的 token_file 指向同一文件。
# 默认空字符串：使用上面的 token 或 macOS App；显式文件读取失败时会报错。
token_file = ""

# 可选域名发现接口的完整 URL 列表；留空跳过域名发现。
cloudapi_urls = []

# 是否读取账户资料并保存在私有原始 JSON 中；默认 true。
fetch_account_info = true

# 是否校验 API 服务的 TLS 证书；默认 false（兼容设置）。
tls_verify = false

# 每个请求的总下载期限，单位秒，范围 0.001–300；默认 15。
request_timeout = 15

# 每个响应的最大字节数，范围 1–67108864；默认 16777216（16 MiB）。
max_response_bytes = 16777216

# 每个 API 地址额外重试的次数，范围 0–10；默认 1，即最多请求 2 次。
retry_per_url = 1


# ── 2. 原始数据与订阅输出 ────────────────────────────────────
[data]

# 原始节点和账户 JSON，包含私密信息；默认 data/latest-wwss-nodes.json。
raw_file = "data/latest-wwss-nodes.json"

# Clash 和 QX 输出目录；默认 data/subscriptions。
# 所有相对路径以项目根目录为基准，支持 ~ 表示用户目录。
output_dir = "data/subscriptions"

[output]

# 仅包含 proxies 的 Clash 节点订阅文件名；分组和分流由独立扩展提供。
clash_file = "WestWorldVPN-clash.yaml"

# Quantumult X 输出文件名（不能包含目录）；默认 WestWorldVPN-quantumultx.txt。
quantumultx_file = "WestWorldVPN-quantumultx.txt"

# 覆盖前保留一份 .bak 备份；默认 true。
backup_old = true

# QX 文件按地区标注注释（地区内直接按名称排序）；默认 true。
include_quantumultx_group = true

# 在两份订阅头中包含账户邮箱、到期时间和流量；默认 false。
include_account_info = false

# 生成的 Trojan 节点是否校验证书；默认 false，独立于下载时的 TLS 设置。
tls_verify = false


# ── 3. 失败重试与日志 ────────────────────────────────────────
[schedule]

# 一次触发的最大尝试次数（含首次），范围 1–20；默认 3。
# 命令行 --once 会覆盖本项，只执行一次。
max_attempts = 3

# 失败后等待多少分钟重试，范围 0–1440，可为小数；默认 5.0。
# 每天几点执行由外部调度器设置，这里只控制失败重试。
retry_interval_minutes = 5.0

[log]

# 日志路径；默认 logs/subloader.log，按 2 MiB × 3 份备份轮转。
file = "logs/subloader.log"

# 日志级别：debug / info / warning / error / critical；默认 info。
level = "info"
